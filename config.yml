# Bedrock Proxy configuration
# The listen address should normally be 0.0.0.0 so the proxy accepts
# packets arriving on the VPS's public network interface. Players still
# connect to the VPS public IP, not to 0.0.0.0.
listen:
  address: "0.0.0.0"
  port: 19132

destination:
  host: "YOUR-DESTINATION-HOST"
  port: 19132

timeouts:
  connect_seconds: 15
  spawn_seconds: 30
